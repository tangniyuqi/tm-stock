name: CI

# 为什么需要 CI：git hooks 需要每个人手动 install，不装就没约束。
# CI 是最后一道、也是唯一无法绕过的防线（--no-verify 影响不到它）。

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  compliance:
    name: 🔴 合规红线与密钥（最高优先级）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 合规禁用词扫描
        run: bash scripts/check-compliance-words.sh --all

      # 门禁自己的测试：范围（含 backend/server 的 api/client、model、service/quant、config）、
      # 词表副本与 eval/ 夹具放行、三种模式（--all、单文件、暂存区）口径一致。
      - name: 合规词门禁自测（范围与三种模式口径）
        run: bash scripts/dev/verify-compliance-gate.sh

      # GVA 与 server/internal/ai/guard 各嵌入一份词表副本，单一源是 scripts/compliance-forbidden-words.txt。
      - name: 词表副本与单一源一致
        run: bash scripts/sync-guard-words.sh --check

      - name: 明文密钥扫描
        run: bash scripts/check-secret-scan.sh --all

      # 给门禁本身写测试：门禁失效是【静默】的——它照样打印 [OK]，只是什么都没拦住。
      # 已实测到两例这样的失效（见 known-pitfalls P16），故必须自测。
      - name: 密钥扫描器自测（28 项正反例）
        run: bash scripts/dev/verify-secret-scan.sh

      - name: 禁用词表未被削弱（只增不减）
        run: |
          COUNT=$(grep -vcE '^[[:space:]]*(#|$)' scripts/compliance-forbidden-words.txt)
          echo "当前禁用词数量：$COUNT"
          # 基线 30 —— 词表只允许增加。若因律师意见需减少，请同步下调此数字并在 PR 说明理由。
          if [ "$COUNT" -lt 30 ]; then
            echo "::error::禁用词表被削弱（$COUNT < 30）。删词必须有律师意见支撑，禁止为过门禁而删。"
            exit 1
          fi

      - name: 密钥基线未膨胀（只减不增）
        run: |
          COUNT=$(grep -vcE '^[[:space:]]*(#|$)' scripts/secret-scan-baseline.txt || echo 0)
          echo "当前豁免条目：$COUNT"
          # 基线 0 —— 新项目不应有存量豁免。新增豁免须在 PR 里说明。
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::密钥扫描基线有 $COUNT 条豁免，请确认每条都是真实存量而非为过门禁而加。"
          fi

  backend:
    name: Go 后端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # 版本从 go.mod 读，不写死。
      # 写死过一次 '1.22'，随后 go get 拉驱动时把 go.mod 顶到 1.24，
      # 两边就对不上了 —— 单一事实源能避免这类漂移。
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: gofmt 格式检查
        run: |
          UNFMT=$(gofmt -l . | grep -v vendor || true)
          if [ -n "$UNFMT" ]; then
            echo "::error::以下文件未格式化，请跑 gofmt -w ."
            echo "$UNFMT"
            exit 1
          fi

      - name: 架构分层守护
        working-directory: .
        run: bash scripts/check-architecture.sh

      - name: 原生迁移客户端探测自测（不替代真库断言）
        working-directory: .
        run: bash scripts/dev/verify-migrations.sh --self-test-probe

      - name: go vet
        run: go vet ./...

      - name: 编译
        run: go build ./...

      - name: 单元测试（-race）+ 执行数下限守卫
        run: |
          # 为什么要数：`go test ./...` 在【没有任何测试】时也返回 0。
          # 只看退出码无法区分「测试全过」与「一个都没跑」，
          # 而 Actions 日志需 admin 权限才能读 —— 于是把判据做成门禁，绿灯即证明。
          set -o pipefail
          go test ./... -race -count=1 -v 2>&1 | tee /tmp/gotest.log | tail -40
          PASS=$(grep -c '^[[:space:]]*--- PASS' /tmp/gotest.log || true)
          FAIL=$(grep -c '^[[:space:]]*--- FAIL' /tmp/gotest.log || true)
          echo "通过 $PASS 项 / 失败 $FAIL 项"
          echo "### Go 单测：通过 $PASS 项，失败 $FAIL 项" >> "$GITHUB_STEP_SUMMARY"
          # 下限只增不减。新增测试后请同步上调；调低必须在 PR 说明理由。
          # 原下限1195；问答会话边界/HTTP/配置/装配与结构单测新增40项，TestEvalReport仍按设计跳过。
          # 再加临时模型会话配置1根10子例及认证工厂1根，共12项。
          # 本地worker退出类别诊断1根8子例，不得输出原始错误。
          # 本地反馈管理配置与监听前保护2根15子例。
          # 本地问答文件、策略摘要、控制器及装配保护新增53项。
          # 专题比较/字段核98个节点，存储引用与非法读取2个根测试。
          # 会话档案引用增加16个普通测试节点（选择/隐私/服务/非法装配）。
          # 引用配置、HTTP闭集与默认关闭装配增加48个普通测试节点。
          MIN=1560
          if [ "$PASS" -lt "$MIN" ]; then
            echo "::error::实际执行 $PASS 项测试，低于下限 $MIN —— 要么测试没被执行，要么有测试被删。"
            exit 1
          fi

      - name: 受限问答执行核必跑（不调用真实模型）
        run: |
          set -o pipefail
          go test -race ./internal/ai/qa -count=1 -v 2>&1 | tee /tmp/qa.log | tail -20
          ROOTS=$(grep -cE '^--- PASS: (Test|Fuzz)' /tmp/qa.log || true)
          PASS=$(grep -cE '^[[:space:]]*--- PASS:' /tmp/qa.log || true)
          if [ "$ROOTS" -lt 30 ] || [ "$PASS" -lt 282 ]; then
            echo "::error::问答核实际根组 $ROOTS / 通过 $PASS，低于30/282；不能由其它包测试充数。"
            exit 1
          fi

      # 合规与计费链路上的关键包（护栏、渲染器、模型适配层）：覆盖率只增不减，下限登记在 scripts/coverage-floors.txt。
      - name: 关键包覆盖率棘轮
        working-directory: .
        run: bash scripts/check-coverage-floor.sh

  # GVA（backend/server）此前完全不在 CI 里：令牌类型隔离、题材股票的依据与审核、AI 任务下线、
  # AutoMigrate 守卫这些改动没有任何自动化兜底。这里只跑与这些改动相关的关键包（包清单与
  # scripts/harness-checks.sh 的 [3.2/4] 保持一致）；GVA 其余上游代码的测试不在本作业范围内。
  gva-backend:
    name: GVA 后端（关键包）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/server/go.mod
          cache: false

      - name: 关键包单测（-race）+ 执行数下限守卫
        run: |
          set -o pipefail
          go test -race ./middleware/... ./service/member/... ./router/... ./api/client/... ./initialize/... ./service/quant/... ./utils ./service/feedbackconsole ./api/v1/quant -count=1 -v 2>&1 | tee /tmp/gva.log | tail -40
          go test -race ./config -run '^TestFeedbackConsoleConfig$' -count=1 -v 2>&1 | tee -a /tmp/gva.log
          (cd ../.. && bash scripts/check-feedback-console-coverage.sh)
          PASS=$(grep -c '^[[:space:]]*--- PASS' /tmp/gva.log || true)
          FAIL=$(grep -c '^[[:space:]]*--- FAIL' /tmp/gva.log || true)
          SKIP=$(grep -c '^[[:space:]]*--- SKIP' /tmp/gva.log || true)
          echo "通过 $PASS 项 / 失败 $FAIL 项 / 跳过 $SKIP 项"
          echo "### GVA 关键包单测：通过 $PASS 项，失败 $FAIL 项，跳过 $SKIP 项" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SKIP" -gt 0 ]; then
            echo "::error::有 $SKIP 项被跳过，等于没测到"; exit 1
          fi
            FEEDBACK_CONSOLE=$(grep -Ec '^--- PASS: TestFeedbackConsole(Config|Client|MalformedAndTransport|CurrentAdmin|DecisionProof|HTTP|Registration|Catalog|Login) ' /tmp/gva.log || true)
          FEEDBACK_CONSOLE_PROOFS=$(grep -Ec '^[[:space:]]+--- PASS: TestFeedbackConsoleDecisionProof/' /tmp/gva.log || true)
            FEEDBACK_CONSOLE_REVOKED=$(grep -Ec '^[[:space:]]+--- PASS: TestFeedbackConsoleHTTP/permission_revoked_' /tmp/gva.log || true)
            FEEDBACK_CONSOLE_CATALOG=$(grep -Ec '^[[:space:]]+--- PASS: TestFeedbackConsoleCatalog/' /tmp/gva.log || true)
            if [ "$FEEDBACK_CONSOLE" -ne 9 ] || [ "$FEEDBACK_CONSOLE_PROOFS" -ne 4 ] || [ "$FEEDBACK_CONSOLE_REVOKED" -ne 3 ] || [ "$FEEDBACK_CONSOLE_CATALOG" -ne 5 ]; then
            echo "::error::反馈后台权限、转接或写后身份核验用例漏跑"; exit 1
          fi
            # 下限只增不减；原159，再增加目录/真实登录2根组与目录5个子例。
            MIN=166
          if [ "$PASS" -lt "$MIN" ]; then
            echo "::error::实际执行 $PASS 项测试，低于下限 $MIN —— 要么测试没被执行，要么有测试被删。"
            exit 1
          fi

  # 单独一个 job：需要 MySQL 服务，且比其他检查慢，不拖累主路径。
  # 为什么必须有：单测里的 SQL 断言只能查"字符串含某片段"，
  # 查不出列名拼错 / 类型不匹配 / JOIN 写反 / Scan 顺序错位 —— 只有真执行才暴露。
  integration:
    name: 集成测试（MySQL ${{ matrix.mysql }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.46', '9.7.0']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: fake-ci-only-not-a-secret
          MYSQL_DATABASE: tm_stock_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 跨进程用例还编译原GVA密码桥，工具链须同时满足两个模块。
          go-version-file: backend/server/go.mod
          cache: false

      # ★ 不能只信 service 的 mysqladmin ping：
      #   mysql 镜像首次初始化会先起一个 --skip-networking 的临时服务器，
      #   ping 对它立刻成功，而真服务器还没起来。撞进这个窗口后续全查空。
      #   → 用 TCP 连接再确认一次（本地实测踩过这个坑）。
      - name: 等待 MySQL 真就绪（TCP 探测）
        run: |
          for i in $(seq 1 60); do
            if mysql -h 127.0.0.1 -P 3306 --protocol=TCP \
                 -uroot -p"fake-ci-only-not-a-secret" -N -B -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL 就绪（第 $i 次探测）"; exit 0
            fi
            sleep 2
          done
          echo "::error::MySQL 120 秒内未就绪"; exit 1

      - name: 执行集成测试 + 执行数下限守卫
        working-directory: server
        env:
          TM_TEST_DSN: "root:fake-ci-only-not-a-secret@tcp(127.0.0.1:3306)/tm_stock_it?parseTime=true&multiStatements=true&charset=utf8mb4&loc=Local"
        run: |
          set -o pipefail
          go test -p 1 -race -tags=integration ./internal/repository/... ./integration/points/... ./integration/agents/... ./cmd/api/... -skip '^TestIntegrationAIReportLocalWorkerRecovery$' -timeout=20m -count=1 -v 2>&1 | tee /tmp/it.log | tail -40
          # 原一分钟租约必须自然到期；独立串行计时，不压缩租约或挤占原套件期限。
          go test -p 1 -race -tags=integration ./integration/points -run '^TestIntegrationAIReportLocalWorkerRecovery$' -timeout=20m -count=1 -v 2>&1 | tee -a /tmp/it.log | tail -40
          # 原自然30秒执行期限与一分钟租约不缩短；独立精准运行，不挤占原套件看门狗。
          go test -p 1 -race -tags=integration,browser ./integration/points -run '^TestIntegrationAIReportTimeoutRecovery$' -timeout=5m -count=1 -v 2>&1 | tee /tmp/timeout-recovery.log
          TIMEOUT_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportTimeoutRecovery ' /tmp/timeout-recovery.log || true)
          TIMEOUT_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportTimeoutRecovery/(Read_Committed|Repeatable_Read) ' /tmp/timeout-recovery.log || true)
          TIMEOUT_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP' /tmp/timeout-recovery.log || true)
          if [ "$TIMEOUT_ROOT" -ne 1 ] || [ "$TIMEOUT_LEVELS" -ne 2 ] || [ "$TIMEOUT_SKIPS" -ne 0 ]; then
            echo '::error::自然执行超时、有效租约拒绝接管与到期取消释放的两种隔离级别未完整验收'; exit 1
          fi
          DEEP_GATEWAY_ROOT=$(grep -Ec '^--- PASS: TestIntegrationDeepH5GatewayHTTP ' /tmp/it.log || true)
          DEEP_GATEWAY_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationDeepH5GatewayHTTP/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          if [ "$DEEP_GATEWAY_ROOT" -ne 1 ] || [ "$DEEP_GATEWAY_LEVELS" -ne 2 ]; then
            echo '::error::深度会话原网关、异步worker、报告及单次结算的两种隔离级别未完整验收'; exit 1
          fi
          DEEP_UPGRADE_ROOTS=$(grep -Ec '^--- PASS: TestIntegrationAIReportDeepUpgrade(Execution|PreservesHistory) ' /tmp/it.log || true)

          DEEP_QUEUE_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportDeepQueue ' /tmp/it.log || true)

          QUEUE_LOOP_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportQueueLoop ' /tmp/it.log || true)
          QUEUE_LOOP_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportQueueLoop/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          QUEUE_PROCESS_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportQueueProcess ' /tmp/it.log || true)
          LOCAL_INSTANCE_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportLocalInstance ' /tmp/it.log || true)
          LOCAL_INSTANCE_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalInstance/' /tmp/it.log || true)
          LOCAL_INSTANCE_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP: TestIntegrationAIReportLocalInstance' /tmp/it.log || true)
          LOCAL_PUBLICATION_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportLocalPublication ' /tmp/it.log || true)
          LOCAL_PUBLICATION_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalPublication/(Read_Committed|Repeatable_Read)/(1|2) ' /tmp/it.log || true)
          LOCAL_PUBLICATION_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP: TestIntegrationAIReportLocalPublication' /tmp/it.log || true)
          CALL_AUDIT_STARTUP_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportCallAuditStartup ' /tmp/it.log || true)
          CALL_AUDIT_STARTUP_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportCallAuditStartup/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          CALL_AUDIT_STARTUP_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportCallAuditStartup/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          CALL_AUDIT_STARTUP_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP: TestIntegrationAIReportCallAuditStartup' /tmp/it.log || true)
          LOCAL_WORKER_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportLocalWorkerProcess ' /tmp/it.log || true)
          LOCAL_WORKER_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalWorkerProcess/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          LOCAL_WORKER_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalWorkerProcess/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          LOCAL_WORKER_SHORT_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalWorkerProcess/(Read_Committed|Repeatable_Read)/deep_short ' /tmp/it.log || true)
          LOCAL_WORKER_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP: TestIntegrationAIReportLocalWorkerProcess' /tmp/it.log || true)
          LOCAL_RECOVERY_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportLocalWorkerRecovery ' /tmp/it.log || true)
          LOCAL_RECOVERY_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalWorkerRecovery/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          LOCAL_RECOVERY_DEPTHS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalWorkerRecovery/(Read_Committed|Repeatable_Read)/(1|2) ' /tmp/it.log || true)
          LOCAL_RECOVERY_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalWorkerRecovery/(Read_Committed|Repeatable_Read)/(1|2)/(final|agent|model|queued) ' /tmp/it.log || true)
          LOCAL_RECOVERY_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP: TestIntegrationAIReportLocalWorkerRecovery' /tmp/it.log || true)
          LOCAL_SIGNAL_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportLocalWorkerSignal ' /tmp/it.log || true)
          LOCAL_SIGNAL_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalWorkerSignal/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          LOCAL_SIGNAL_DEPTHS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalWorkerSignal/(Read_Committed|Repeatable_Read)/(1|2) ' /tmp/it.log || true)
          LOCAL_SIGNAL_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalWorkerSignal/(Read_Committed|Repeatable_Read)/(1|2)/(idle|agent|model) ' /tmp/it.log || true)
          LOCAL_SIGNAL_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP: TestIntegrationAIReportLocalWorkerSignal([ /]|$)' /tmp/it.log || true)
          LOCAL_API_WORKER_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportLocalAPIWorker ' /tmp/it.log || true)
          LOCAL_API_WORKER_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalAPIWorker/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          LOCAL_API_WORKER_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalAPIWorker/(Read_Committed|Repeatable_Read)/(1|2) ' /tmp/it.log || true)
          LOCAL_API_WORKER_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP: TestIntegrationAIReportLocalAPIWorker' /tmp/it.log || true)
          LOCAL_FEEDBACK_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportLocalFeedbackProcess ' /tmp/it.log || true)
          LOCAL_FEEDBACK_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalFeedbackProcess/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          LOCAL_FEEDBACK_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalFeedbackProcess/(Read_Committed|Repeatable_Read)/(1|2) ' /tmp/it.log || true)
          LOCAL_FEEDBACK_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP: TestIntegrationAIReportLocalFeedbackProcess' /tmp/it.log || true)
          LOCAL_QA_ROOT=$(grep -Ec '^--- PASS: TestIntegrationAIReportLocalQAProcess ' /tmp/it.log || true)
          LOCAL_QA_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalQAProcess/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          LOCAL_QA_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportLocalQAProcess/(Read_Committed|Repeatable_Read)/(1|2) ' /tmp/it.log || true)
          LOCAL_QA_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP: TestIntegrationAIReportLocalQAProcess' /tmp/it.log || true)
          if [ "$LOCAL_QA_ROOT" -ne 1 ] || [ "$LOCAL_QA_LEVELS" -ne 2 ] || [ "$LOCAL_QA_CASES" -ne 4 ] || [ "$LOCAL_QA_SKIPS" -ne 0 ]; then
            echo "实际API/worker轻深报告后的资料问答及报告追问验收漏跑"; exit 1
          fi
          if [ "$LOCAL_FEEDBACK_ROOT" -ne 1 ] || [ "$LOCAL_FEEDBACK_LEVELS" -ne 2 ] || [ "$LOCAL_FEEDBACK_CASES" -ne 4 ] || [ "$LOCAL_FEEDBACK_SKIPS" -ne 0 ]; then
            echo "实际API/worker及独立管理进程的轻深反馈提交/处理/查询用例漏跑"; exit 1
          fi
          if [ "$LOCAL_API_WORKER_ROOT" -ne 1 ] || [ "$LOCAL_API_WORKER_LEVELS" -ne 2 ] || [ "$LOCAL_API_WORKER_CASES" -ne 4 ] || [ "$LOCAL_API_WORKER_SKIPS" -ne 0 ]; then
            echo "原密码登录与实际API、独立worker轻深报告结算验收未完整通过"; exit 1
          fi
          LOCAL_H5_ROOTS=$(grep -Ec '^--- PASS: TestLocalAPIWorkerH5(Configuration|Gateway|AssistantGateway) ' /tmp/it.log || true)
          LOCAL_H5_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestLocalAPIWorkerH5Configuration/' /tmp/it.log || true)
          LOCAL_H5_SKIPS=$(grep -Ec '^[[:space:]]*--- SKIP: TestLocalAPIWorkerH5' /tmp/it.log || true)
