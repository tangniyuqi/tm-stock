          if [ "$REPORT_UNKNOWN_FAILURE" -ne 2 ] || [ "$REPORT_UNKNOWN_FAILURE_LEVELS" -ne 4 ] || [ "$REPORT_UNKNOWN_FAILURE_CASES" -ne 12 ] || [ "$REPORT_UNKNOWN_FAILURE_ATOMICITY" -ne 6 ]; then
            echo "::error::未知调用失败保护、并发恰好一次释放或事务恢复用例未完整执行"; exit 1
          fi
          REPORT_UPSTREAM_TERMINAL=$(grep -Ec '^--- PASS: TestIntegrationAIReportUpstreamTerminal ' /tmp/it.log || true)
          REPORT_UPSTREAM_TERMINAL_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportUpstreamTerminal/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          REPORT_UPSTREAM_TERMINAL_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportUpstreamTerminal/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          if [ "$REPORT_UPSTREAM_TERMINAL" -ne 1 ] || [ "$REPORT_UPSTREAM_TERMINAL_LEVELS" -ne 2 ] || [ "$REPORT_UPSTREAM_TERMINAL_CASES" -ne 14 ]; then
            echo "::error::上游确认失败/取消、隔离终态回执、原子释放或旧围栏保护用例漏跑"; exit 1
          fi
          REPORT_H5_GATEWAY=$(grep -Ec '^--- PASS: TestIntegrationAIReportH5Gateway ' /tmp/it.log || true)
          REPORT_H5_GATEWAY_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportH5Gateway/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          REPORT_H5_GATEWAY_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportH5Gateway/(Read_Committed|Repeatable_Read)/(success|cancel|library|receipt_unknown|running_cancel|feedback) ' /tmp/it.log || true)
          REPORT_H5_ORIGIN=$(grep -Ec '^--- PASS: TestH5TestOrigin ' /tmp/it.log || true)
          REPORT_H5_LOGIN_GUARDS=$(grep -Ec '^--- PASS: TestH5MemberLogin(Configuration|PassLine) ' /tmp/it.log || true)
          REPORT_H5_LOGIN_CONFIG_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestH5MemberLoginConfiguration/' /tmp/it.log || true)
          LIVE_CONVERSATION_CONFIG=$(grep -Ec '^--- PASS: TestLiveConversationConfiguration ' /tmp/it.log || true)
          LIVE_CONVERSATION_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestLiveConversationConfiguration/' /tmp/it.log || true)
          if [ "$LIVE_CONVERSATION_CONFIG" -ne 1 ] || [ "$LIVE_CONVERSATION_CASES" -ne 8 ]; then
            echo "::error::真实会话入口无调用配置守卫漏跑"; exit 1
          fi
          LIVE_DEPTH_CONFIG=$(grep -Ec '^--- PASS: TestLiveDepthConfiguration ' /tmp/it.log || true)
          LIVE_DEPTH_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestLiveDepthConfiguration/' /tmp/it.log || true)
          if [ "$LIVE_DEPTH_CONFIG" -ne 1 ] || [ "$LIVE_DEPTH_CASES" -ne 5 ]; then
            echo "::error::真实深度入口无调用配置守卫漏跑"; exit 1
          fi
          REPORT_H5_EOF_WRITER=$(grep -Ec '^--- PASS: TestH5EarlyEOFWriter ' /tmp/it.log || true)
          REPORT_H5_REPLAY_GUARDS=$(grep -Ec '^--- PASS: TestH5StreamReplay(Configuration|Writer) ' /tmp/it.log || true)
          REPORT_H5_REPLAY_CONFIG_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestH5StreamReplayConfiguration/' /tmp/it.log || true)
          if [ "$REPORT_H5_LOGIN_GUARDS" -ne 2 ] || [ "$REPORT_H5_LOGIN_CONFIG_CASES" -ne 8 ] || [ "$REPORT_H5_EOF_WRITER" -ne 1 ] || [ "$REPORT_H5_REPLAY_GUARDS" -ne 2 ] || [ "$REPORT_H5_REPLAY_CONFIG_CASES" -ne 8 ]; then
            echo "::error::原登录模式失败关闭、最终回执识别或原SSE传输包装守卫漏跑"; exit 1
          fi
          REPORT_H5_CONVERSATION=$(grep -Ec '^--- PASS: TestIntegrationAIReportH5Conversation ' /tmp/it.log || true)
          REPORT_H5_CONVERSATION_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportH5Conversation/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          REPORT_H5_CONVERSATION_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportH5Conversation/(Read_Committed|Repeatable_Read)/(success|bind_unknown) ' /tmp/it.log || true)
          if [ "$REPORT_H5_CONVERSATION" -ne 1 ] || [ "$REPORT_H5_CONVERSATION_LEVELS" -ne 2 ] || [ "$REPORT_H5_CONVERSATION_CASES" -ne 4 ]; then
            echo "::error::会话H5门面、绑定回滚恢复或原报告账务用例漏跑"; exit 1
          fi
          if [ "$REPORT_H5_GATEWAY" -ne 1 ] || [ "$REPORT_H5_GATEWAY_LEVELS" -ne 2 ] || [ "$REPORT_H5_GATEWAY_CASES" -ne 12 ] || [ "$REPORT_H5_ORIGIN" -ne 1 ]; then
            echo "::error::本地H5测试接线、真库成功/取消或回环源边界用例漏跑"; exit 1
          fi
          FEEDBACK_ROOTS=$(grep -Ec '^--- PASS: TestIntegrationAIReportFeedback(Lifecycle|Rollback|HTTP|SchemaGuards) ' /tmp/it.log || true)
          ASSISTANT_COMBINED=$(grep -Ec '^--- PASS: TestIntegrationAIReportAssistantCombined ' /tmp/it.log || true)
          ASSISTANT_COMBINED_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportAssistantCombined/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          if [ "$ASSISTANT_COMBINED" -ne 1 ] || [ "$ASSISTANT_COMBINED_LEVELS" -ne 2 ]; then
            echo "::error::同一会话问答、原任务报告与反馈组合验收漏跑"; exit 1
          fi
          FEEDBACK_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportFeedback(Lifecycle|Rollback)/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          FEEDBACK_SCHEMA=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIReportFeedbackSchemaGuards/' /tmp/it.log || true)
          if [ "$FEEDBACK_ROOTS" -ne 4 ] || [ "$FEEDBACK_LEVELS" -ne 4 ] || [ "$FEEDBACK_SCHEMA" -ne 9 ]; then
            echo "::error::反馈真库受理/处理/回滚、会员权限或结构保护用例漏跑"; exit 1
          fi
          CONVERSATION_ROOTS=$(grep -Ec '^--- PASS: TestIntegrationAIConversations(Lifecycle|ConcurrencyAndUnknown|SchemaGuards|ReadOnlyAndCorruption) ' /tmp/it.log || true)
          CONVERSATION_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIConversations(Lifecycle|ConcurrencyAndUnknown|ReadOnlyAndCorruption)/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          CONVERSATION_GUARDS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIConversationsSchemaGuards/' /tmp/it.log || true)
          if [ "$CONVERSATION_ROOTS" -ne 4 ] || [ "$CONVERSATION_LEVELS" -ne 6 ] || [ "$CONVERSATION_GUARDS" -ne 13 ]; then
            echo '::error::会话归属/幂等/CAS/未知提交、只读历史或13类保护拒绝漏跑'; exit 1
          fi
          INTENT_ROOTS=$(grep -Ec '^--- PASS: TestIntegrationAIConversationsTasks(Lifecycle|Recovery|PriceAndArchive|Guards) ' /tmp/it.log || true)
          INTENT_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIConversationsTasks(Lifecycle|Recovery|PriceAndArchive)/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          INTENT_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIConversationsTasks(Lifecycle|Recovery|PriceAndArchive)/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          INTENT_GUARDS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIConversationsTasksGuards/' /tmp/it.log || true)
          if [ "$INTENT_ROOTS" -ne 4 ] || [ "$INTENT_LEVELS" -ne 6 ] || [ "$INTENT_CASES" -ne 18 ] || [ "$INTENT_GUARDS" -ne 6 ]; then
            echo '::error::会话意图原键创建/未知核查/终检结算/关闭恢复或结构保护漏跑'; exit 1
          fi
          QA_ROOTS=$(grep -Ec '^--- PASS: TestIntegrationAIConversationsQA(Lifecycle|Failures|Boundaries|Recovery) ' /tmp/it.log || true)
          QA_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIConversationsQA(Lifecycle|Failures|Boundaries|Recovery)/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          QA_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIConversationsQA(Failures|Boundaries|Recovery)/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          if [ "$QA_ROOTS" -ne 4 ] || [ "$QA_LEVELS" -ne 8 ] || [ "$QA_CASES" -ne 38 ]; then
            echo '::error::问答持久入队/唯一执行/双层配额/当前授权/闭集存证/回执未知及两种隔离子例漏跑'; exit 1
          fi
          QA_HTTP_ROOTS=$(grep -Ec '^--- PASS: TestIntegrationAIConversationsQA(HTTP|HTTPBoundaries|Schema) ' /tmp/it.log || true)
          QA_HTTP_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIConversationsQA(HTTP|HTTPBoundaries)/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          QA_HTTP_BOUNDARIES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIConversationsQAHTTPBoundaries/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          QA_SCHEMA_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAIConversationsQASchema/' /tmp/it.log || true)
          if [ "$QA_HTTP_ROOTS" -ne 3 ] || [ "$QA_HTTP_LEVELS" -ne 4 ] || [ "$QA_HTTP_BOUNDARIES" -ne 18 ] || [ "$QA_SCHEMA_CASES" -ne 20 ]; then
            echo '::error::问答实际JWT/HTTP/配额/当前撤权/原键未知/无模型读取或结构破坏用例漏跑'; exit 1
          fi
          # 保留原1073项，追加问答HTTP/结构45项及启动10项。
          # 原1128，新增实际API/独立worker的1根、2级别与4个轻深用例。
          # 再增加正式进程H5配置1根8子例和只转发网关1根。
          # 两隔离级别各增加一个实际worker临时会话认证成功场景。
          # 两隔离级别各增加深度不足六条引文的实际worker拒绝/释放场景。
          # 实际反馈独立进程新增1根、2级别和4个轻深用例。
          # 本地问答实际进程新增1根、2级别和4个轻深用例。
          # 组合H5网关前置条件及最终收尾核验新增1项。
          # 实际强杀恢复新增1根、2级别、4轻深父组及16种阶段/排队场景。
          # 系统信号专项新增1根、2级别、4轻深父组及12种运行阶段场景。
          # 专题存储新增1根、2隔离级别及38个真实SQL场景。
          # 专题独立API进程新增1根5子例，只转发H5网关新增1根。
          # 会话档案引用新增1根、2隔离级别及32个具体场景。
          # 引用结构11叶、独立API6叶各含1根，H5只转发边界另增1根。
          MIN=1342
          if [ "$PASS" -lt "$MIN" ]; then
            echo "::error::实际执行 $PASS 项，低于下限 $MIN —— 要么没跑，要么有测试被删。"; exit 1
          fi

      # GVA（backend/server）的 MySQL 集成测试：题材与股票表用 GVA 的模型建，题材股票表用本仓库迁移建，
      # 验证联表、LIKE 转义、NULL 状态比较，以及库约束的错误翻译。
      # 必须排在上一步之后串行执行：两边都会清掉并重建 addon_quant_theme、addon_quant_base_stock、addon_quant_theme_stock。
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/server/go.mod
          cache: false

      - name: GVA 集成测试 + 执行数下限守卫
        working-directory: backend/server
        env:
          TM_TEST_DSN: "root:fake-ci-only-not-a-secret@tcp(127.0.0.1:3306)/tm_stock_it?parseTime=true&multiStatements=true&charset=utf8mb4&loc=Local"
        run: |
          set -o pipefail
          go test -tags=integration ./service/quant/ -run MySQL -count=1 -v 2>&1 | tee /tmp/gva_it.log | tail -30
          PASS=$(grep -c '^[[:space:]]*--- PASS' /tmp/gva_it.log || true)
          SKIP=$(grep -c '^[[:space:]]*--- SKIP' /tmp/gva_it.log || true)
          echo "通过 $PASS 项 / 跳过 $SKIP 项"
          echo "### GVA 集成测试：通过 $PASS 项，跳过 $SKIP 项" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SKIP" -gt 0 ]; then
            echo "::error::有 $SKIP 项被跳过 —— TM_TEST_DSN 未生效，等于没测到"; exit 1
          fi
          # 下限只增不减。本地实测 3 项。
          MIN=3
          if [ "$PASS" -lt "$MIN" ]; then
            echo "::error::实际执行 $PASS 项，低于下限 $MIN —— 要么没跑，要么有测试被删。"; exit 1
          fi

      - name: 反馈后台 MySQL 目录与登录专项 + 必跑守卫
        working-directory: backend/server
        env:
          TM_TEST_DSN: "root:fake-ci-only-not-a-secret@tcp(127.0.0.1:3306)/tm_stock_it?parseTime=true&multiStatements=true&charset=utf8mb4&loc=Local"
        run: |
          set -o pipefail
          go test -p 1 -race -tags=integration ./service/feedbackconsole ./api/v1/quant -run '^TestFeedbackConsoleMySQL(Catalog|Login)$' -count=1 -timeout=10m -v 2>&1 | tee /tmp/gva_feedback_it.log | tail -30
          PASS=$(grep -Ec '^[[:space:]]*--- PASS:' /tmp/gva_feedback_it.log || true)
          SKIP=$(grep -Ec '^[[:space:]]*--- SKIP:' /tmp/gva_feedback_it.log || true)
          ROOTS=$(grep -Ec '^--- PASS: TestFeedbackConsoleMySQL(Catalog|Login) ' /tmp/gva_feedback_it.log || true)
          LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestFeedbackConsoleMySQLCatalog/(READ_COMMITTED|REPEATABLE_READ) ' /tmp/gva_feedback_it.log || true)
          CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestFeedbackConsoleMySQLCatalog/(READ_COMMITTED|REPEATABLE_READ)/(concurrent|collision_rollback|soft_deleted|lock_cancel|missing_table|missing_anchor) ' /tmp/gva_feedback_it.log || true)
          if [ "$SKIP" -ne 0 ] || [ "$ROOTS" -ne 2 ] || [ "$LEVELS" -ne 2 ] || [ "$CASES" -ne 12 ] || [ "$PASS" -lt 16 ]; then
            echo '::error::反馈后台MySQL目录并发/回滚/关闭保护或真实登录授权未完整执行'; exit 1
          fi

  frontend:
    name: 前端（uni-app x）源码行为与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Agent本地评估网关守卫（无Key、无网络、无付费调用）
        run: node --test scripts/dev/tradingcn-live-gateway.test.mjs scripts/dev/tradingcn-local-chain.test.mjs

      - name: 会员报告与依据展示源码测试（不替代HBuilderX）
        run: |
          set -euo pipefail
          qa_dir="$(mktemp -d "${RUNNER_TEMP}/tm-stock-ai-ui.XXXXXX")"
          npm install --prefix "$qa_dir" --ignore-scripts --package-lock=false --no-audit --no-fund \
            vue@3.5.13 @vue/compiler-sfc@3.5.13 @vue/server-renderer@3.5.13 typescript@5.7.2 axios@1.8.2 vue-router@4.4.3
          node scripts/dev/verify-ai-report-ui.cjs "$qa_dir"
          node scripts/dev/verify-member-login-script.cjs "$qa_dir"
          node scripts/dev/verify-ai-task-stream.cjs "$qa_dir"
          node scripts/dev/verify-ai-qa-ui.cjs "$qa_dir"
          node scripts/dev/verify-evidence-ui.cjs "$qa_dir"
          node scripts/dev/verify-ai-feedback-admin-ui.cjs "$qa_dir"

      - name: 配置文件 JSON 合法性
        run: |
          for f in pages.json manifest.json platformConfig.json; do
            [ -f "$f" ] || continue
            node -e "
              const fs=require('fs');
              let s=fs.readFileSync('$f','utf8');
              // uni-app 配置允许注释，校验前先剥离
              s=s.replace(/\/\*[\s\S]*?\*\//g,'').replace(/^\s*\/\/.*$/gm,'');
              try { JSON.parse(s); console.log('✅ $f 合法'); }
              catch(e){ console.log('::error::$f 解析失败: '+e.message); process.exit(1); }
            "
          done

      - name: 页面注册一致性（pages/ 下的页面应在 pages.json 注册）
        run: |
          node -e "
            const fs=require('fs');
            let s=fs.readFileSync('pages.json','utf8')
              .replace(/\/\*[\s\S]*?\*\//g,'').replace(/^\s*\/\/.*\$/gm,'');
            const cfg=JSON.parse(s);
            const reg=new Set((cfg.pages||[]).map(p=>p.path));
            const walk=(d,out=[])=>{
              for(const e of fs.readdirSync(d,{withFileTypes:true})){
                const p=d+'/'+e.name;
                if(e.isDirectory()) walk(p,out);
                else if(e.name.endsWith('.uvue')) out.push(p.replace(/^\.\//,'').replace(/\.uvue\$/,''));
              }
              return out;
            };
            if(!fs.existsSync('pages')){console.log('无 pages/ 目录，跳过');process.exit(0)}
            const files=walk('pages');
            const missing=files.filter(f=>!reg.has(f));
            if(missing.length){
              console.log('::warning::以下页面文件未在 pages.json 注册：');
              missing.forEach(m=>console.log('  - '+m));
            } else {
              console.log('✅ 页面注册一致（共 '+files.length+' 个）');
            }
          "

  docs:
    name: 规范完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 关键规范文件必须存在
        run: |
          MISSING=0
          for f in \
            CLAUDE.md AGENTS.md WORKFLOW.md README.md \
            .claude/agents/compliance-redline.md \
            .claude/agents/methodology.md \
            .claude/agents/domain-glossary.md \
            .claude/agents/known-pitfalls.md \
            .claude/agents/task-completion-rule.md \
            .claude/agents/api-contract-alignment.md \
            .claude/agents/PIPELINE.md \
            .claude/skills/requirement-pipeline/SKILL.md \
            .claude/skills/code-change-workflow/SKILL.md \
            scripts/check-architecture.sh \
            scripts/autonomous/validate-task.sh \
            .cursor/rules/tm-stock-compliance.mdc \
            .cursor/rules/tm-stock-methodology.mdc \
            scripts/compliance-forbidden-words.txt \
            scripts/check-compliance-words.sh \
            scripts/harness-checks.sh \
            docs/GOALS.md ; do
            if [ ! -f "$f" ]; then echo "::error::缺失关键规范文件: $f"; MISSING=1; fi
          done
          [ "$MISSING" -eq 0 ] && echo "✅ 关键规范文件齐全"
          exit $MISSING

      - name: Cursor 规则必须 alwaysApply（否则不会自动生效）
        run: |
          FAIL=0
          for f in .cursor/rules/*.mdc; do
            if ! grep -q '^alwaysApply: true' "$f"; then
              echo "::error::$f 缺少 alwaysApply: true —— 规则不会自动注入，等于形同虚设"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "✅ 全部 Cursor 规则均自动生效"
          exit $FAIL

      - name: 上线前置授权义务（保持可见，不阻断）
        run: |
          F="docs/上线前置授权清单.md"
          if [ ! -f "$F" ]; then echo "::error::缺失 $F"; exit 1; fi
          # 口径：只数「- **状态**：⛔ 未开始」这种条目行，不要把顶部图例行也数进来
          OPEN=$(grep -c '^- \*\*状态\*\*：⛔ 未开始' "$F" || true)
          echo "未闭环的上线前置义务：$OPEN 项"
          grep -B3 '^- \*\*状态\*\*：⛔ 未开始' "$F" | grep '^## ' | sed 's/^## /  ⛔ /' || true
          if [ "$OPEN" -gt 0 ]; then
            echo "::warning::有 $OPEN 项上线前置授权未完成。开发不受影响，但公网上线前必须全部闭环（漏掉即侵权/违规）。"
          fi

      - name: 禁止任务总结文档
        run: |
          FOUND=$(find docs -maxdepth 2 -type f \( \
            -name "*完成报告*" -o -name "*实施总结*" -o -name "*开发总结*" \
            -o -name "SUMMARY.md" -o -name "IMPLEMENTATION_REPORT.md" \) 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::检测到任务总结文档（违反 no-summary-docs 规范）："
            echo "$FOUND"
            exit 1
          fi
          echo "✅ 无任务总结文档"
