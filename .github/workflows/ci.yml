name: CI

# 为什么需要 CI：git hooks 需要每个人手动 install，不装就没约束。
# CI 是最后一道、也是唯一无法绕过的防线（--no-verify 影响不到它）。

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  compliance:
    name: 🔴 合规红线与密钥（最高优先级）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 合规禁用词扫描
        run: bash scripts/check-compliance-words.sh --all

      # 门禁自己的测试：范围（含 backend/server 的 api/client、model、service/quant、config）、
      # 词表副本与 eval/ 夹具放行、三种模式（--all、单文件、暂存区）口径一致。
      - name: 合规词门禁自测（范围与三种模式口径）
        run: bash scripts/dev/verify-compliance-gate.sh

      # GVA 与 server/internal/ai/guard 各嵌入一份词表副本，单一源是 scripts/compliance-forbidden-words.txt。
      - name: 词表副本与单一源一致
        run: bash scripts/sync-guard-words.sh --check

      - name: 明文密钥扫描
        run: bash scripts/check-secret-scan.sh --all

      # 给门禁本身写测试：门禁失效是【静默】的——它照样打印 [OK]，只是什么都没拦住。
      # 已实测到两例这样的失效（见 known-pitfalls P16），故必须自测。
      - name: 密钥扫描器自测（28 项正反例）
        run: bash scripts/dev/verify-secret-scan.sh

      - name: 禁用词表未被削弱（只增不减）
        run: |
          COUNT=$(grep -vcE '^[[:space:]]*(#|$)' scripts/compliance-forbidden-words.txt)
          echo "当前禁用词数量：$COUNT"
          # 基线 30 —— 词表只允许增加。若因律师意见需减少，请同步下调此数字并在 PR 说明理由。
          if [ "$COUNT" -lt 30 ]; then
            echo "::error::禁用词表被削弱（$COUNT < 30）。删词必须有律师意见支撑，禁止为过门禁而删。"
            exit 1
          fi

      - name: 密钥基线未膨胀（只减不增）
        run: |
          COUNT=$(grep -vcE '^[[:space:]]*(#|$)' scripts/secret-scan-baseline.txt || echo 0)
          echo "当前豁免条目：$COUNT"
          # 基线 0 —— 新项目不应有存量豁免。新增豁免须在 PR 里说明。
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::密钥扫描基线有 $COUNT 条豁免，请确认每条都是真实存量而非为过门禁而加。"
          fi

  backend:
    name: Go 后端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # 版本从 go.mod 读，不写死。
      # 写死过一次 '1.22'，随后 go get 拉驱动时把 go.mod 顶到 1.24，
      # 两边就对不上了 —— 单一事实源能避免这类漂移。
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: gofmt 格式检查
        run: |
          UNFMT=$(gofmt -l . | grep -v vendor || true)
          if [ -n "$UNFMT" ]; then
            echo "::error::以下文件未格式化，请跑 gofmt -w ."
            echo "$UNFMT"
            exit 1
          fi

      - name: 架构分层守护
        working-directory: .
        run: bash scripts/check-architecture.sh

      - name: 原生迁移客户端探测自测（不替代真库断言）
        working-directory: .
        run: bash scripts/dev/verify-migrations.sh --self-test-probe

      - name: go vet
        run: go vet ./...

      - name: 编译
        run: go build ./...

      - name: 单元测试（-race）+ 执行数下限守卫
        run: |
          # 为什么要数：`go test ./...` 在【没有任何测试】时也返回 0。
          # 只看退出码无法区分「测试全过」与「一个都没跑」，
          # 而 Actions 日志需 admin 权限才能读 —— 于是把判据做成门禁，绿灯即证明。
          set -o pipefail
          go test ./... -race -count=1 -v 2>&1 | tee /tmp/gotest.log | tail -40
          PASS=$(grep -c '^[[:space:]]*--- PASS' /tmp/gotest.log || true)
          FAIL=$(grep -c '^[[:space:]]*--- FAIL' /tmp/gotest.log || true)
          echo "通过 $PASS 项 / 失败 $FAIL 项"
          echo "### Go 单测：通过 $PASS 项，失败 $FAIL 项" >> "$GITHUB_STEP_SUMMARY"
          # 下限只增不减。新增测试后请同步上调；调低必须在 PR 说明理由。
          # 原下限1195；问答会话边界/HTTP/配置/装配与结构单测新增40项，TestEvalReport仍按设计跳过。
          MIN=1235
          if [ "$PASS" -lt "$MIN" ]; then
            echo "::error::实际执行 $PASS 项测试，低于下限 $MIN —— 要么测试没被执行，要么有测试被删。"
            exit 1
          fi

      - name: 受限问答执行核必跑（不调用真实模型）
        run: |
          set -o pipefail
          go test -race ./internal/ai/qa -count=1 -v 2>&1 | tee /tmp/qa.log | tail -20
          ROOTS=$(grep -cE '^--- PASS: (Test|Fuzz)' /tmp/qa.log || true)
          PASS=$(grep -cE '^[[:space:]]*--- PASS:' /tmp/qa.log || true)
          if [ "$ROOTS" -lt 30 ] || [ "$PASS" -lt 282 ]; then
            echo "::error::问答核实际根组 $ROOTS / 通过 $PASS，低于30/282；不能由其它包测试充数。"
            exit 1
          fi

      # 合规与计费链路上的关键包（护栏、渲染器、模型适配层）：覆盖率只增不减，下限登记在 scripts/coverage-floors.txt。
      - name: 关键包覆盖率棘轮
        working-directory: .
        run: bash scripts/check-coverage-floor.sh

  # GVA（backend/server）此前完全不在 CI 里：令牌类型隔离、题材股票的依据与审核、AI 任务下线、
  # AutoMigrate 守卫这些改动没有任何自动化兜底。这里只跑与这些改动相关的关键包（包清单与
  # scripts/harness-checks.sh 的 [3.2/4] 保持一致）；GVA 其余上游代码的测试不在本作业范围内。
  gva-backend:
    name: GVA 后端（关键包）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/server/go.mod
          cache: false

      - name: 关键包单测（-race）+ 执行数下限守卫
        run: |
          set -o pipefail
          go test -race ./middleware/... ./service/member/... ./router/... ./api/client/... ./initialize/... ./service/quant/... ./utils ./service/feedbackconsole ./api/v1/quant -count=1 -v 2>&1 | tee /tmp/gva.log | tail -40
          go test -race ./config -run '^TestFeedbackConsoleConfig$' -count=1 -v 2>&1 | tee -a /tmp/gva.log
          (cd ../.. && bash scripts/check-feedback-console-coverage.sh)
          PASS=$(grep -c '^[[:space:]]*--- PASS' /tmp/gva.log || true)
          FAIL=$(grep -c '^[[:space:]]*--- FAIL' /tmp/gva.log || true)
          SKIP=$(grep -c '^[[:space:]]*--- SKIP' /tmp/gva.log || true)
          echo "通过 $PASS 项 / 失败 $FAIL 项 / 跳过 $SKIP 项"
          echo "### GVA 关键包单测：通过 $PASS 项，失败 $FAIL 项，跳过 $SKIP 项" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SKIP" -gt 0 ]; then
            echo "::error::有 $SKIP 项被跳过，等于没测到"; exit 1
          fi
            FEEDBACK_CONSOLE=$(grep -Ec '^--- PASS: TestFeedbackConsole(Config|Client|MalformedAndTransport|CurrentAdmin|DecisionProof|HTTP|Registration|Catalog|Login) ' /tmp/gva.log || true)
          FEEDBACK_CONSOLE_PROOFS=$(grep -Ec '^[[:space:]]+--- PASS: TestFeedbackConsoleDecisionProof/' /tmp/gva.log || true)
            FEEDBACK_CONSOLE_REVOKED=$(grep -Ec '^[[:space:]]+--- PASS: TestFeedbackConsoleHTTP/permission_revoked_' /tmp/gva.log || true)
            FEEDBACK_CONSOLE_CATALOG=$(grep -Ec '^[[:space:]]+--- PASS: TestFeedbackConsoleCatalog/' /tmp/gva.log || true)
            if [ "$FEEDBACK_CONSOLE" -ne 9 ] || [ "$FEEDBACK_CONSOLE_PROOFS" -ne 4 ] || [ "$FEEDBACK_CONSOLE_REVOKED" -ne 3 ] || [ "$FEEDBACK_CONSOLE_CATALOG" -ne 5 ]; then
            echo "::error::反馈后台权限、转接或写后身份核验用例漏跑"; exit 1
          fi
            # 下限只增不减；原159，再增加目录/真实登录2根组与目录5个子例。
            MIN=166
          if [ "$PASS" -lt "$MIN" ]; then
            echo "::error::实际执行 $PASS 项测试，低于下限 $MIN —— 要么测试没被执行，要么有测试被删。"
            exit 1
          fi

  # 单独一个 job：需要 MySQL 服务，且比其他检查慢，不拖累主路径。
  # 为什么必须有：单测里的 SQL 断言只能查"字符串含某片段"，
  # 查不出列名拼错 / 类型不匹配 / JOIN 写反 / Scan 顺序错位 —— 只有真执行才暴露。
  integration:
    name: 集成测试（MySQL ${{ matrix.mysql }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.46', '9.7.0']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: fake-ci-only-not-a-secret
          MYSQL_DATABASE: tm_stock_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      # ★ 不能只信 service 的 mysqladmin ping：
      #   mysql 镜像首次初始化会先起一个 --skip-networking 的临时服务器，
      #   ping 对它立刻成功，而真服务器还没起来。撞进这个窗口后续全查空。
      #   → 用 TCP 连接再确认一次（本地实测踩过这个坑）。
      - name: 等待 MySQL 真就绪（TCP 探测）
        run: |
          for i in $(seq 1 60); do
            if mysql -h 127.0.0.1 -P 3306 --protocol=TCP \
                 -uroot -p"fake-ci-only-not-a-secret" -N -B -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL 就绪（第 $i 次探测）"; exit 0
            fi
            sleep 2
          done
          echo "::error::MySQL 120 秒内未就绪"; exit 1

      - name: 执行集成测试 + 执行数下限守卫
        working-directory: server
        env:
          TM_TEST_DSN: "root:fake-ci-only-not-a-secret@tcp(127.0.0.1:3306)/tm_stock_it?parseTime=true&multiStatements=true&charset=utf8mb4&loc=Local"
        run: |
          set -o pipefail
          go test -p 1 -race -tags=integration ./internal/repository/... ./integration/points/... ./integration/agents/... ./cmd/api/... -timeout=20m -count=1 -v 2>&1 | tee /tmp/it.log | tail -40
          PASS=$(grep -c '^[[:space:]]*--- PASS' /tmp/it.log || true)
          SKIP=$(grep -c '^[[:space:]]*--- SKIP' /tmp/it.log || true)
          echo "通过 $PASS 项 / 跳过 $SKIP 项"
          echo "### 集成测试：通过 $PASS 项，跳过 $SKIP 项" >> "$GITHUB_STEP_SUMMARY"
          # SKIP 不能冒充通过：DSN 没配时测试会整体 skip，那等于没测。
          if [ "$SKIP" -gt 0 ]; then
            echo "::error::有 $SKIP 项被跳过 —— TM_TEST_DSN 未生效，等于没测到"; exit 1
          fi
          # 原下限 34，加跨层账本套件的 35 项（含 RC/RR、旧快照、用户锁范围、全账户对账与时区）；不可让仓储增项掩盖账本漏跑。
          POINTS=$(grep -Ec '^--- PASS: TestIntegrationPoints(RoundTripAndReplay|TwoHundredConcurrentFreezes|IdempotencyAndTerminalRace|GuardsParentRollbackAndCorruption|MultipleLotsAndTerminalRollback|DriverLocationCannotShiftUTCLedger|RefundRewardRoundTrip|DebtRollbackAndExpiryBasis|DebtConcurrency|DebtIntegerLimit|ParentRepeatableReadSnapshot|AuditUserIndexScope|AuditSweep) ' /tmp/it.log || true)
          if [ "$POINTS" -ne 13 ]; then
            echo "::error::账本核心套件只通过 $POINTS / 13 组"; exit 1
          fi
          TASKS=$(grep -Ec '^--- PASS: TestIntegrationAITask(RoundTrip|RollbackAndGuards|Concurrency|ConcurrentCreates|SchemaProbe|SchemaCorruption|SchemaRestrictedCLI) ' /tmp/it.log || true)
          if [ "$TASKS" -ne 7 ]; then
            echo "::error::持久化任务套件只通过 $TASKS / 7 组"; exit 1
          fi
          MEMBER_READS=$(grep -Ec '^--- PASS: TestIntegrationAITaskMemberReads ' /tmp/it.log || true)
          if [ "$MEMBER_READS" -ne 1 ]; then
            echo "::error::会员任务只读套件未通过"; exit 1
          fi
          BUDGETS=$(grep -Ec '^--- PASS: TestIntegrationAITaskBudget(Lifecycle|Concurrency|IndependentTasks|RecoveryAndRollback|SchemaCorruption) ' /tmp/it.log || true)
          if [ "$BUDGETS" -ne 5 ]; then
            echo "::error::持久预算套件只通过 $BUDGETS / 5 组"; exit 1
          fi
          BUDGET_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskBudget(Lifecycle|Concurrency|IndependentTasks)/' /tmp/it.log || true)
          BUDGET_CORRUPTION=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskBudgetSchemaCorruption/' /tmp/it.log || true)
          if [ "$BUDGET_LEVELS" -ne 6 ] || [ "$BUDGET_CORRUPTION" -ne 15 ]; then
            echo "::error::持久预算隔离级别或保护破坏子例漏跑"; exit 1
          fi
          AGENTS=$(grep -Ec '^--- PASS: TestIntegrationAgent(LifecycleAndProtections|ConcurrentReserveAndDurableLimit|AuditFailureRollsBackAndNeverReplays|ProbeDetectsMissingProtection|ConcurrentCancelAndAuditIntegrity|CLI) ' /tmp/it.log || true)
          if [ "$AGENTS" -ne 6 ]; then
            echo "::error::外部 Agent 套件只通过 $AGENTS / 6 组"; exit 1
          fi
          STAGES=$(grep -Ec '^--- PASS: TestIntegrationAITaskStage(Lifecycle|Concurrency|IndependentTasks|RecoveryAndRollback|ValidationBoundaries|SchemaCorruption) ' /tmp/it.log || true)
          STAGE_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskStage(Lifecycle|Concurrency|IndependentTasks)/' /tmp/it.log || true)
          STAGE_RECOVERY=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskStageRecoveryAndRollback/' /tmp/it.log || true)
          STAGE_VALIDATION=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskStageValidationBoundaries/' /tmp/it.log || true)
          STAGE_CORRUPTION=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskStageSchemaCorruption/' /tmp/it.log || true)
          if [ "$STAGES" -ne 6 ] || [ "$STAGE_LEVELS" -ne 6 ] || [ "$STAGE_RECOVERY" -ne 3 ] || [ "$STAGE_VALIDATION" -ne 3 ] || [ "$STAGE_CORRUPTION" -ne 18 ]; then
            echo "::error::阶段检查点核心组、隔离级别、恢复/校验边界或保护破坏子例漏跑"; exit 1
          fi
          EXTRACTION=$(grep -Ec '^--- PASS: TestIntegrationAITaskStageExtraction(Policy|Rejections) ' /tmp/it.log || true)
          EXTRACTION_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskStageExtraction(Policy|Rejections)/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          EXTRACTION_REJECTIONS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskStageExtractionRejections/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          if [ "$EXTRACTION" -ne 2 ] || [ "$EXTRACTION_LEVELS" -ne 4 ] || [ "$EXTRACTION_REJECTIONS" -ne 20 ]; then
            echo "::error::真实抽取守卫阶段接线或隔离级别/拒绝子例漏跑"; exit 1
          fi
          RECOVERY=$(grep -Ec '^--- PASS: TestIntegrationAITaskRecovery(Lifecycle|ProcessCrash|CLI) ' /tmp/it.log || true)
          RECOVERY_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskRecoveryLifecycle/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          RECOVERY_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskRecoveryLifecycle/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          RECOVERY_PROCESS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskRecoveryProcessCrash/' /tmp/it.log || true)
          RECOVERY_CLI=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskRecoveryCLI/' /tmp/it.log || true)
          if [ "$RECOVERY" -ne 3 ] || [ "$RECOVERY_LEVELS" -ne 2 ] || [ "$RECOVERY_CASES" -ne 16 ] || [ "$RECOVERY_PROCESS" -ne 2 ] || [ "$RECOVERY_CLI" -ne 4 ]; then
            echo "::error::恢复 worker 的生命周期、隔离级别、独立进程或实际命令用例漏跑"; exit 1
          fi
          MEMBER_CANCEL=$(grep -Ec '^--- PASS: TestIntegrationAITaskMemberCancel(Lifecycle|Concurrency|RollbackAndUnknown) ' /tmp/it.log || true)
          MEMBER_CANCEL_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskMemberCancel(Lifecycle|Concurrency|RollbackAndUnknown)/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          CANCEL_STARTUP=$(grep -Ec '^--- PASS: TestIntegrationAITaskCancelStartup ' /tmp/it.log || true)
          CANCEL_STARTUP_CASES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskCancelStartup/' /tmp/it.log || true)
          if [ "$MEMBER_CANCEL" -ne 3 ] || [ "$MEMBER_CANCEL_LEVELS" -ne 6 ] || [ "$CANCEL_STARTUP" -ne 1 ] || [ "$CANCEL_STARTUP_CASES" -ne 6 ]; then
            echo "::error::会员取消的事务、隔离级别、启动失败关闭或受限权限用例漏跑"; exit 1
          fi
          MEMBER_EVENTS=$(grep -Ec '^--- PASS: TestIntegrationAITaskMemberEvents(Lifecycle|Snapshot|Corruption) ' /tmp/it.log || true)
          MEMBER_EVENT_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskMemberEvents(Lifecycle|Snapshot|Corruption)/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          MEMBER_EVENT_CORRUPTION=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskMemberEventsCorruption/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          if [ "$MEMBER_EVENTS" -ne 3 ] || [ "$MEMBER_EVENT_LEVELS" -ne 6 ] || [ "$MEMBER_EVENT_CORRUPTION" -ne 16 ]; then
            echo "::error::会员事件的分页、只读快照、隔离级别或损坏拒绝子例漏跑"; exit 1
          fi
          MEMBER_EVENT_STREAM=$(grep -Ec '^--- PASS: TestIntegrationAITaskMemberEventsStream ' /tmp/it.log || true)
          MEMBER_EVENT_STREAM_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskMemberEventsStream/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          if [ "$MEMBER_EVENT_STREAM" -ne 1 ] || [ "$MEMBER_EVENT_STREAM_LEVELS" -ne 2 ]; then
            echo "::error::会员SSE的真库只读、断点续读、连接中撤权或两种隔离级别用例漏跑"; exit 1
          fi
          EXPIRY=$(grep -Ec '^--- PASS: TestIntegrationAITaskExpiry(Lifecycle|Atomicity|Concurrent|CLI) ' /tmp/it.log || true)
          EXPIRY_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskExpiry(Lifecycle|Atomicity|Concurrent)/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          EXPIRY_ATOMIC=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskExpiryAtomicity/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          EXPIRY_CLI=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskExpiryCLI/' /tmp/it.log || true)
          if [ "$EXPIRY" -ne 4 ] || [ "$EXPIRY_LEVELS" -ne 6 ] || [ "$EXPIRY_ATOMIC" -ne 4 ] || [ "$EXPIRY_CLI" -ne 4 ]; then
            echo "::error::过期清扫的生命周期、隔离级别、并发、原子性或编译命令漏跑"; exit 1
          fi
          AGENT_BRIDGE=$(grep -Ec '^--- PASS: TestIntegrationAITaskAgentBridge(Lifecycle|Recovery|Boundaries|Concurrent) ' /tmp/it.log || true)
          AGENT_BRIDGE_LEVELS=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskAgentBridge(Lifecycle|Recovery|Boundaries|Concurrent)/(Read_Committed|Repeatable_Read) ' /tmp/it.log || true)
          AGENT_BRIDGE_RECOVERY=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskAgentBridgeRecovery/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          AGENT_BRIDGE_BOUNDARIES=$(grep -Ec '^[[:space:]]+--- PASS: TestIntegrationAITaskAgentBridgeBoundaries/(Read_Committed|Repeatable_Read)/' /tmp/it.log || true)
          if [ "$AGENT_BRIDGE" -ne 4 ] || [ "$AGENT_BRIDGE_LEVELS" -ne 8 ] || [ "$AGENT_BRIDGE_RECOVERY" -ne 8 ] || [ "$AGENT_BRIDGE_BOUNDARIES" -ne 10 ]; then
            echo "::error::任务-Agent 接线的生命周期、隔离级别、恢复、边界或并发子例漏跑"; exit 1
          fi
          REPORTS=$(grep -Ec '^--- PASS: TestIntegrationAIReport(Lifecycle|Boundaries|Atomicity|Concurrency|Schema|Recovery) ' /tmp/it.log || true)
